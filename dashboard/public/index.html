<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1020" />
    <title>League</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <div class="main">
        <header class="league-head">
          <div class="league-title">
            <img class="avatar" id="league-avatar" alt="" hidden />
            <h1 id="league-name">Loading…</h1>
            <div class="league-meta">
              <span id="status" class="pill" aria-live="polite"></span>
              <button id="refresh" type="button" class="icon-btn">Refresh</button>
            </div>
          </div>
          <nav class="tabs" role="tablist" aria-label="Sections">
            <button type="button" role="tab" data-tab="matchup">Matchup</button>
            <button type="button" role="tab" data-tab="team">Team</button>
            <button type="button" role="tab" data-tab="waivers">Waivers</button>
            <button type="button" role="tab" data-tab="league">League</button>
            <button type="button" role="tab" data-tab="trade">Trade</button>
            <button type="button" role="tab" data-tab="news">News</button>
            <button type="button" role="tab" data-tab="players" class="tab-players">Players</button>
          </nav>
        </header>

        <div class="activity-bar" id="activity-bar" role="button" tabindex="0" aria-label="Open your players' activity">
          <span class="label">ACTIVITY</span>
          <span class="text" id="activity-text">Loading…</span>
        </div>

        <div class="main-views">
          <section class="view" data-view="matchup" aria-label="Matchup"></section>
          <section class="view" data-view="team" aria-label="Team" hidden></section>
          <section class="view" data-view="waivers" aria-label="Waivers" hidden></section>
          <section class="view" data-view="league" aria-label="League" hidden></section>
          <section class="view" data-view="trade" aria-label="Trade" hidden></section>
          <section class="view" data-view="news" aria-label="News" hidden></section>
        </div>

        <footer class="footer">
          <p>
            Read-only view of public data from Sleeper, ESPN, Rotowire and
            FantasyCalc. Points are in your league's scoring; projections are
            Sleeper's, adjusted for recent usage, news and market activity.
          </p>
          <details id="feeds">
            <summary>Data feeds <span id="feeds-mode"></span></summary>
            <ul class="feed-status" id="feeds-list"></ul>
          </details>
        </footer>
      </div>

      <aside class="pane" aria-label="Players">
        <div class="pane-top">
          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input id="search" type="search" placeholder="Search players…" autocomplete="off" aria-label="Search players" />
          </label>
          <div class="pane-tabs" role="tablist" aria-label="Players lists">
            <button type="button" role="tab" data-pane="available">Available</button>
            <button type="button" role="tab" data-pane="trend">Trend</button>
            <button type="button" role="tab" data-pane="leaders">Leaders</button>
            <button type="button" role="tab" data-pane="activity">Activity</button>
          </div>
        </div>
        <div class="pane-filters" id="pane-filters"></div>
        <div class="pane-body" id="pane-body"></div>
      </aside>
    </div>
  </body>
</html>
